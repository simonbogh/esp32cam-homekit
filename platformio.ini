; AI-Thinker ESP32-CAM -> Apple Home (native HomeKit via patched HomeSpan, no bridge)
; Arduino-ESP32 core 3.3.x is required by HomeSpan 2.x, hence the pioarduino platform.

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv

; Serial port is auto-detected. If several are connected, set it explicitly, e.g. (macOS, CH340):
; upload_port = /dev/cu.wchusbserial10
; monitor_port = /dev/cu.wchusbserial10
upload_speed = 460800

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_eol = LF
monitor_echo = yes
monitor_filters = esp32_exception_decoder, send_on_enter

build_flags =
  -DCAM_XCLK_MHZ=12        ; measured best on this board (see README); switch at runtime with serial "@x8" / "@x20"
  -DDECLINE_MODE=1         ; Stage 1 live-view decline: 1 = SetupEndpoints BUSY, 2 = StreamingStatus UNAVAILABLE
  ; minih264e configuration (must be identical for the library and its users: it changes struct layouts)
  -DH264E_SVC_API=0
  -DH264E_MAX_THREADS=0
  -DH264E_ENABLE_DENOISE=0
  -DMAX_LONG_TERM_FRAMES=1
